<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>TimeTrackingApp – Approval</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #EDE8E8; --card: #FFFFFF; --text: #283237; --text-muted: #5E7682;
      --primary: #3C1EEB; --success: #0E9537; --border: #C4CFD4;
      --input-bg: #FFFFFF; --muted: #F3F0F0; --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; line-height: 1.5;
      display: flex; justify-content: center; align-items: flex-start; padding: 2.5rem 1.5rem; }
    .card { width: min(420px, 100%); padding: 1.5rem; border-radius: 8px; background: var(--card);
      border: 1px solid var(--border); box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); transition: width 0.2s ease; }
    .card.wide { width: min(820px, 100%); }
    h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
    h2 { font-size: 0.9375rem; font-weight: 600; margin-bottom: 0.75rem; }
    .field { display: flex; flex-direction: column; gap: 0.375rem; margin-bottom: 0.875rem; }
    label { font-size: 0.875rem; font-weight: 500; color: var(--text); }
    input[type="password"], input[type="text"] {
      width: 100%; height: 2.25rem; padding: 0 0.75rem; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--input-bg); color: var(--text);
      font-family: 'Figtree', system-ui, sans-serif; font-size: 0.875rem; outline: none; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgb(60 30 235 / 0.12); }
    button { cursor: pointer; font-family: 'Figtree', system-ui, sans-serif; font-size: 0.875rem;
      font-weight: 500; height: 2.25rem; padding: 0 1rem; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      transition: background 0.15s; display: inline-flex; align-items: center;
      justify-content: center; white-space: nowrap; gap: 0.375rem; }
    button:hover { background: var(--muted); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: #2F18BC; border-color: #2F18BC; }
    #loginBtn { width: 100%; height: 2.5rem; margin-top: 0.25rem;
      background: var(--primary); color: #fff; border-color: var(--primary); }
    .dashboard-header { display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1rem; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--muted); }
    th { text-align: left; padding: 0.5rem 0.75rem; font-size: 0.75rem; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border); }
    td { padding: 0.625rem 0.75rem; font-size: 0.875rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--muted); }
    .action-btn { height: 1.75rem; padding: 0 0.625rem; font-size: 0.75rem; font-weight: 500;
      font-family: 'Figtree', system-ui, sans-serif; background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer;
      display: inline-flex; align-items: center; transition: background 0.15s; white-space: nowrap; }
    .action-btn:hover { background: var(--muted); }
    .modal { display: none; position: fixed; inset: 0; background: rgb(0 0 0 / 0.45);
      z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
    .modal.visible { display: flex; }
    .modal-content { background: var(--card); border-radius: 8px; border: 1px solid var(--border);
      padding: 1.5rem; max-width: 820px; width: 100%; box-shadow: 0 4px 16px rgb(0 0 0 / 0.12);
      max-height: 90vh; overflow-y: auto; }
    .hidden { display: none !important; }
    .status { margin-top: 0.75rem; min-height: 1.1rem; font-size: 0.8rem; color: var(--text-muted); }
    .pin-input input { width: 100%; height: 2.5rem; padding: 0 0.875rem; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--input-bg); color: var(--text);
      font-family: 'Figtree', monospace; font-size: 1.25rem; text-align: center;
      letter-spacing: 0.4rem; font-weight: 600; outline: none; }
    .pin-input input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgb(60 30 235 / 0.12); }
    #langBar { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.375rem;
      font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>
<main class="card" id="mainCard">
  <!-- Brand -->
  <div style="margin-bottom:1rem;padding-bottom:0.875rem;border-bottom:1px solid #C4CFD4;">
    <img src="https://static.wixstatic.com/media/4e9ff1_be4e966e9c6e49568cb04ccdba355512~mv2.png/v1/fill/w_126,h_40,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/4e9ff1_be4e966e9c6e49568cb04ccdba355512~mv2.png" alt="Salaxy" style="height:28px;width:auto;display:block;" />
  </div>

  <!-- Login -->
  <section id="loginSection">
    <h1 style="margin-bottom:0.25rem;" data-i18n="approval.login_title"></h1>
    <p style="font-size:0.875rem;color:#5E7682;margin-bottom:1rem;" data-i18n="login.subtitle"></p>
    <div class="pin-input" style="margin-bottom:0.875rem;">
      <input type="password" inputmode="numeric" maxlength="6" autocomplete="one-time-code" id="pinInput" data-i18n-aria-label="login.pin_label" />
    </div>
    <button id="loginBtn" data-i18n="login.sign_in_button"></button>
    <div class="status" id="loginStatus"></div>
    <div style="margin-top:0.875rem;padding:0.75rem;border-radius:6px;background:#FFF8F0;border:1px solid #F25A02;border-left:3px solid #F25A02;font-size:0.8rem;color:#283237;">
      <strong style="display:block;margin-bottom:0.375rem;color:#F25A02;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;">For testing / debug only</strong>
      <div id="approvalDebugContent" style="color:#5E7682;" data-i18n="common.loading"></div>
    </div>
  </section>

  <!-- Dashboard -->
  <section id="dashboard" class="hidden">
    <div class="dashboard-header">
      <div>
        <h1 data-i18n="approval.dashboard_title"></h1>
        <p data-i18n="approval.dashboard_subtitle"></p>
        <p style="font-size:0.9rem;color:#666;"><span data-i18n="common.logged_in_as"></span> <strong id="supervisorName"></strong></p>
        <div id="langBar" class="hidden">
          <span data-i18n="language.personal_language_label"></span>
          <span id="langSelectContainer"></span>
        </div>
      </div>
      <button id="logoutBtn" data-i18n="common.logout"></button>
    </div>

    <div class="table-wrapper">
      <table>
        <thead><tr>
          <th data-i18n="approval.col_employee"></th>
          <th data-i18n="approval.col_pending"></th>
          <th data-i18n="approval.col_approved"></th>
          <th data-i18n="approval.col_rejected"></th>
          <th data-i18n="approval.col_actions"></th>
        </tr></thead>
        <tbody id="teamTbody">
          <tr><td colspan="5" style="color:#7D95A1;padding:1rem 0.75rem;" data-i18n="common.loading"></td></tr>
        </tbody>
      </table>
    </div>
    <div class="status" id="dashStatus"></div>
  </section>
</main>

<!-- Entries modal -->
<div id="entriesModal" class="modal">
  <div class="modal-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h2 id="entriesModalTitle" style="margin:0;"></h2>
      <button id="closeEntriesModal" style="flex-shrink:0;">✕ <span data-i18n="common.close"></span></button>
    </div>

    <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;margin-bottom:0.75rem;">
      <label style="display:flex;align-items:center;gap:0.375rem;font-size:0.8rem;cursor:pointer;">
        <input type="checkbox" id="selectAllEntries" style="accent-color:#3C1EEB;"> <span data-i18n="entries.select_all"></span>
      </label>
      <button id="approveSelectedBtn" class="action-btn" style="color:#0E9537;border-color:#A7E3B5;" data-i18n="entries.approve_selected"></button>
      <button id="rejectSelectedBtn"  class="action-btn" style="color:#E01541;border-color:#F5AABB;" data-i18n="entries.reject_selected"></button>
      <select id="entriesGrouping" style="height:1.75rem;border-radius:6px;border:1px solid #C4CFD4;font-family:inherit;font-size:0.8rem;padding:0 0.5rem;background:#fff;">
        <option value="day" data-i18n="grouping.day"></option>
        <option value="week" selected data-i18n="grouping.week"></option>
        <option value="month" data-i18n="grouping.month"></option>
        <option value="year" data-i18n="grouping.year"></option>
      </select>
    </div>

    <div id="rejectDialog" class="hidden" style="background:#FEF2F4;border:1px solid #F5AABB;border-radius:6px;padding:0.75rem;margin-bottom:0.75rem;">
      <p style="font-size:0.8rem;margin-bottom:0.5rem;font-weight:500;" data-i18n="entries.rejection_reason_prompt"></p>
      <input type="text" id="rejectNoteInput" data-i18n-placeholder="entries.rejection_placeholder"
        style="width:100%;height:2rem;padding:0 0.625rem;border-radius:6px;border:1px solid #F5AABB;font-family:inherit;font-size:0.8rem;background:#fff;" />
      <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
        <button id="confirmRejectBtn" style="height:1.75rem;padding:0 0.75rem;font-size:0.8rem;background:#E01541;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:500;" data-i18n="entries.reject"></button>
        <button id="cancelRejectBtn"  style="height:1.75rem;padding:0 0.75rem;font-size:0.8rem;background:#fff;border:1px solid #C4CFD4;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:500;" data-i18n="common.cancel"></button>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead><tr>
          <th style="width:2rem;text-align:center;"></th>
          <th data-i18n="entries.col_date"></th>
          <th data-i18n="entries.col_time"></th>
          <th data-i18n="entries.col_hours"></th>
          <th data-i18n="entries.col_project"></th>
          <th data-i18n="entries.col_status"></th>
          <th data-i18n="approval.col_actions"></th>
        </tr></thead>
        <tbody id="entriesTbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/js/i18n.js"></script>
<script>
  const companySlug = window.location.pathname.split('/').filter(Boolean)[0] || '';
  initPageLang(companySlug);

  let currentEntriesEmployeeId = null;
  let currentSupervisorId = null;
  let pendingRejectIds = [];

  fetch('/api/debug_credentials.php')
    .then(r => r.json())
    .then(data => {
      const el = document.getElementById('approvalDebugContent');
      const sups = (data.supervisors || []).filter(s => s.slug === companySlug);
      el.innerHTML = sups.length
        ? `<strong>${i18n.t('admin.debug_supervisors_label')}</strong><br>` + sups.map(s => `${s.first_name} ${s.last_name} — PIN: <code style="background:#fde68a;padding:1px 5px;border-radius:4px;">${s.pin}</code>`).join('<br>')
        : i18n.t('admin.debug_no_supervisors');
    })
    .catch(() => { document.getElementById('approvalDebugContent').textContent = i18n.t('admin.debug_no_data'); });

  function escapeHtml(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmtDate(isoDate) {
    if (!isoDate) return '';
    const [y,m,d] = isoDate.split('-'); return `${d}.${m}.${y}`;
  }
  function fmtDateTime(iso) {
    const d = new Date(iso);
    const locale = i18n.t('locale.date_locale');
    const at = i18n.t('time.at');
    return d.toLocaleDateString(locale, {day:'2-digit',month:'2-digit',year:'numeric'}) + ', ' + at + ' ' +
           d.toLocaleTimeString(locale, {hour:'2-digit',minute:'2-digit'});
  }
  function showDashStatus(msg, isError = false) {
    const el = document.getElementById('dashStatus');
    el.textContent = msg; el.style.color = isError ? '#E01541' : '#5E7682';
  }
  function statusLabel(status) {
    const map = {
      pending:  `<span style="color:#7D95A1">${i18n.t('status.pending')}</span>`,
      approved: `<span style="color:#0E9537;font-weight:600">${i18n.t('status.approved')}</span>`,
      rejected: `<span style="color:#E01541;font-weight:600">${i18n.t('status.rejected')}</span>`,
      clarified:`<span style="color:#F25A02;font-weight:600">${i18n.t('status.clarified')}</span>`,
    };
    return map[status] || status;
  }

  function renderLangBar(supervisorId, currentLang) {
    const langBar = document.getElementById('langBar');
    const container = document.getElementById('langSelectContainer');
    container.innerHTML = i18n.buildLangSelect(currentLang, 'supervisor_self', supervisorId);
    langBar.classList.remove('hidden');
    container.querySelector('select').addEventListener('change', async (e) => {
      const ok = await switchUserLang(e.target.value, 'supervisor_self', supervisorId);
      if (ok) {
        i18n.applyToDOM();
        loadTeam();
        if (!document.getElementById('entriesModal').classList.contains('visible')) return;
        refreshEntries();
      }
    });
  }

  // ─── Login ────────────────────────────────────────────────────────────────
  const loginBtn = document.getElementById('loginBtn');
  const pinInput = document.getElementById('pinInput');

  async function tryLogin() {
    const pin = pinInput.value.trim();
    if (!pin) { document.getElementById('loginStatus').textContent = i18n.t('login.error_enter_pin_short'); return; }
    loginBtn.disabled = true;
    try {
      const res    = await fetch('/api/supervisor_login.php', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ pin, slug: companySlug }),
      });
      const result = await res.json();
      if (!res.ok || !result.success) {
        document.getElementById('loginStatus').textContent = result.error || i18n.t('login.error_failed');
        return;
      }
      currentSupervisorId = result.supervisor.id;
      document.getElementById('supervisorName').textContent =
        result.supervisor.first_name + ' ' + result.supervisor.last_name;

      if (result.ui_language && result.ui_language !== i18n.getLang()) {
        await i18n.load(result.ui_language);
        localStorage.setItem('company_lang_' + (companySlug || '_'), result.ui_language);
      }

      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('mainCard').classList.add('wide');
      renderLangBar(currentSupervisorId, i18n.getLang());
      loadTeam();
    } finally { loginBtn.disabled = false; }
  }
  loginBtn.addEventListener('click', tryLogin);
  pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/logout.php');
    window.location.reload();
  });

  // ─── Team list ────────────────────────────────────────────────────────────
  async function loadTeam() {
    const tbody = document.getElementById('teamTbody');
    tbody.innerHTML = `<tr><td colspan="5" style="color:#7D95A1;padding:1rem">${i18n.t('common.loading')}</td></tr>`;
    try {
      const entriesRes    = await fetch('/api/time_entries.php');
      const entriesResult = await entriesRes.json();
      if (!entriesResult.success) {
        tbody.innerHTML = `<tr><td colspan="5">${i18n.t('common.error')}</td></tr>`;
        return;
      }

      const entries = entriesResult.entries || [];
      const byEmp   = {};
      entries.forEach(e => {
        if (!byEmp[e.employee_id]) {
          byEmp[e.employee_id] = { id: e.employee_id, name: e.employee_name, pending: 0, pendingHours: 0, approved: 0, rejected: 0 };
        }
        if (e.status === 'pending' || e.status === 'clarified') {
          byEmp[e.employee_id].pending++;
          byEmp[e.employee_id].pendingHours += parseFloat(e.hours) || 0;
        } else if (e.status === 'approved') byEmp[e.employee_id].approved++;
        else if (e.status === 'rejected') byEmp[e.employee_id].rejected++;
      });

      const employees = Object.values(byEmp);
      if (!employees.length) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:#7D95A1;padding:1rem">${i18n.t('approval.no_team_entries')}</td></tr>`;
        return;
      }

      tbody.innerHTML = employees.map(emp => `
        <tr>
          <td>${escapeHtml(emp.name)}</td>
          <td>${emp.pending > 0 ? `<span style="background:#FEF0E0;color:#C45800;border-radius:4px;padding:0.1rem 0.4rem;font-size:0.8rem;font-weight:600;">▲ ${emp.pendingHours.toFixed(1)}h</span>` : `<span style="color:#C4CFD4">–</span>`}</td>
          <td><span style="color:#0E9537;">${emp.approved}</span></td>
          <td><span style="color:#E01541;">${emp.rejected}</span></td>
          <td><button class="action-btn" onclick="openEntriesModal(${emp.id}, '${escapeHtml(emp.name)}')">${i18n.t('approval.view_entries')}</button></td>
        </tr>`).join('');
    } catch { tbody.innerHTML = `<tr><td colspan="5" style="color:#E01541;">${i18n.t('common.server_error')}</td></tr>`; }
  }

  // ─── Entries modal ────────────────────────────────────────────────────────
  const entriesModal      = document.getElementById('entriesModal');
  const entriesModalTitle = document.getElementById('entriesModalTitle');
  const entriesTbody      = document.getElementById('entriesTbody');
  const entriesGrouping   = document.getElementById('entriesGrouping');
  const selectAllEntries  = document.getElementById('selectAllEntries');
  const approveSelectedBtn = document.getElementById('approveSelectedBtn');
  const rejectSelectedBtn  = document.getElementById('rejectSelectedBtn');
  const rejectDialog       = document.getElementById('rejectDialog');
  const rejectNoteInput    = document.getElementById('rejectNoteInput');
  const confirmRejectBtn   = document.getElementById('confirmRejectBtn');
  const cancelRejectBtn    = document.getElementById('cancelRejectBtn');

  function renderEntries(entries, grouping) {
    if (!entries.length) {
      entriesTbody.innerHTML = `<tr><td colspan="7" style="color:#7D95A1;padding:1rem">${i18n.t('common.no_entries')}</td></tr>`;
      return;
    }
    const grouped = {};
    entries.forEach(e => {
      let key;
      const d = e.entry_date;
      if      (grouping === 'day')   key = d;
      else if (grouping === 'week') {
        const dt = new Date(d); const day = dt.getDay() || 7;
        const mon = new Date(dt); mon.setDate(dt.getDate() - (day - 1));
        key = i18n.t('time.week_label') + ' ' + mon.toLocaleDateString(i18n.t('locale.date_locale'), {day:'2-digit',month:'2-digit'});
      }
      else if (grouping === 'month') key = d.slice(0,7);
      else                           key = d.slice(0,4);
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(e);
    });
    let html = '';
    for (const [group, rows] of Object.entries(grouped)) {
      const totH  = rows.reduce((s,r) => s + (parseFloat(r.hours)||0), 0);
      const totKm = rows.reduce((s,r) => s + (parseFloat(r.km)||0),    0);
      html += `<tr style="background:#F3F0F0;"><td colspan="7" style="padding:0.375rem 0.75rem;font-size:0.75rem;font-weight:600;color:#5E7682;letter-spacing:0.04em;text-transform:uppercase;">
        ${escapeHtml(group)} — ${totH.toFixed(1)}h${totKm > 0 ? ' / ' + totKm + ' km' : ''}
      </td></tr>`;
      rows.forEach(e => {
        const clarHtml = e.employee_clarification
          ? `<div style="margin-top:0.25rem;font-size:0.75rem;color:#F25A02;border-left:2px solid #F25A02;padding-left:0.4rem">${i18n.t('entries.clarification_label')} ${escapeHtml(e.employee_clarification)}</div>` : '';
        const rejHtml  = e.rejection_note
          ? `<div style="margin-top:0.25rem;font-size:0.75rem;color:#E01541;border-left:2px solid #E01541;padding-left:0.4rem">${i18n.t('entries.rejection_reason_label')} ${escapeHtml(e.rejection_note)}</div>` : '';
        html += `<tr>
          <td style="text-align:center;"><input type="checkbox" class="entry-checkbox" data-id="${e.id}" style="accent-color:#3C1EEB;width:1rem;height:1rem;"></td>
          <td>${fmtDate(e.entry_date)}</td>
          <td>${escapeHtml(e.start_time||'')}${e.end_time?'–'+escapeHtml(e.end_time):''}</td>
          <td>${parseFloat(e.hours).toFixed(1)}h${parseFloat(e.km)>0?' / '+e.km+' km':''}</td>
          <td>${escapeHtml(e.project||'')}${e.comment?'<br><span style="color:#7D95A1;font-size:0.75rem;">'+escapeHtml(e.comment)+'</span>':''}</td>
          <td>${statusLabel(e.status)}${clarHtml}${rejHtml}${e.exported_to_salaxy ? `<div style="margin-top:0.25rem;font-size:0.72rem;color:#3C1EEB;">${i18n.t('entries.exported_on')} ${fmtDateTime(e.exported_at)}</div>` : ''}</td>
          <td>
            <div style="display:flex;gap:0.25rem;">
              <button class="action-btn approve-btn" data-id="${e.id}" style="color:#0E9537;border-color:#A7E3B5;">✓</button>
              <button class="action-btn reject-btn"  data-id="${e.id}" style="color:#E01541;border-color:#F5AABB;">✗</button>
            </div>
          </td></tr>`;
      });
    }
    entriesTbody.innerHTML = html;
    entriesTbody.querySelectorAll('.approve-btn').forEach(btn =>
      btn.addEventListener('click', () => reviewEntries([Number(btn.dataset.id)], 'approve'))
    );
    entriesTbody.querySelectorAll('.reject-btn').forEach(btn =>
      btn.addEventListener('click', () => openRejectDialog([Number(btn.dataset.id)]))
    );
  }

  async function openEntriesModal(employeeId, employeeName) {
    currentEntriesEmployeeId = employeeId;
    entriesModalTitle.textContent = i18n.t('entries.modal_title', { name: employeeName });
    entriesTbody.innerHTML = `<tr><td colspan="7" style="color:#7D95A1;padding:1rem">${i18n.t('common.loading')}</td></tr>`;
    entriesModal.classList.add('visible');
    await refreshEntries();
  }

  async function refreshEntries() {
    if (!currentEntriesEmployeeId) return;
    try {
      const res    = await fetch(`/api/time_entries.php?employee_id=${currentEntriesEmployeeId}`);
      const result = await res.json();
      if (!res.ok || !result.success) { entriesTbody.innerHTML = `<tr><td colspan="7">${i18n.t('common.error')}</td></tr>`; return; }
      renderEntries(result.entries || [], entriesGrouping.value);
    } catch { entriesTbody.innerHTML = `<tr><td colspan="7">${i18n.t('common.error')}</td></tr>`; }
  }

  async function reviewEntries(ids, action, rejectionNote = '') {
    try {
      const res    = await fetch('/api/review_entries.php', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ ids, action, rejection_note: rejectionNote }),
      });
      const result = await res.json();
      if (!res.ok || !result.success) { showDashStatus(result.error || i18n.t('common.error'), true); return; }
      await refreshEntries();
      loadTeam();
    } catch { showDashStatus(i18n.t('common.server_error'), true); }
  }

  function openRejectDialog(ids) {
    pendingRejectIds = ids; rejectNoteInput.value = '';
    rejectDialog.classList.remove('hidden'); rejectNoteInput.focus();
  }
  confirmRejectBtn.addEventListener('click', async () => {
    rejectDialog.classList.add('hidden');
    await reviewEntries(pendingRejectIds, 'reject', rejectNoteInput.value.trim());
  });
  cancelRejectBtn.addEventListener('click', () => rejectDialog.classList.add('hidden'));

  selectAllEntries.addEventListener('change', () => {
    document.querySelectorAll('.entry-checkbox').forEach(cb => cb.checked = selectAllEntries.checked);
  });
  approveSelectedBtn.addEventListener('click', async () => {
    const ids = [...document.querySelectorAll('.entry-checkbox:checked')].map(cb => Number(cb.dataset.id));
    if (!ids.length) return; await reviewEntries(ids, 'approve');
  });
  rejectSelectedBtn.addEventListener('click', () => {
    const ids = [...document.querySelectorAll('.entry-checkbox:checked')].map(cb => Number(cb.dataset.id));
    if (!ids.length) return; openRejectDialog(ids);
  });
  entriesGrouping.addEventListener('change', refreshEntries);
  document.getElementById('closeEntriesModal').addEventListener('click', () => {
    entriesModal.classList.remove('visible'); currentEntriesEmployeeId = null;
  });
</script>
</body>
</html>
