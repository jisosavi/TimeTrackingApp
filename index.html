<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>TimeTrackingApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #EDE8E8;
      --card: #FFFFFF;
      --text: #283237;
      --text-muted: #5E7682;
      --primary: #3C1EEB;
      --success: #0E9537;
      --border: #C4CFD4;
      --input-bg: #FFFFFF;
      --muted: #F3F0F0;
      --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Figtree', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .login, .chat {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    p { font-size: 0.875rem; color: var(--text-muted); }
    .pin-input input {
      width: 100%;
      height: 2.5rem;
      padding: 0 0.875rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-family: 'Figtree', monospace;
      font-size: 1.25rem;
      text-align: center;
      letter-spacing: 0.4rem;
      font-weight: 600;
      outline: none;
    }
    .pin-input input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgb(60 30 235 / 0.12);
    }
    button {
      cursor: pointer;
      font-family: 'Figtree', system-ui, sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      height: 2.25rem;
      padding: 0 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      transition: background 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:hover { background: var(--muted); }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      width: 100%;
      height: 2.5rem;
    }
    .btn-primary:hover { background: #2F18BC; border-color: #2F18BC; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-salaxy {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
      width: 100%;
      height: 2.5rem;
    }
    .btn-salaxy:hover { background: #0B7C2E; border-color: #0B7C2E; }
    .btn-salaxy:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none !important; }
    .chat-area {
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.875rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      max-height: 55vh;
    }
    .bubble {
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius);
      line-height: 1.5;
      font-size: 0.875rem;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 88%;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .json-toggle {
      color: var(--primary);
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 0.375rem;
      display: inline-block;
    }
    .json-content {
      display: none;
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem;
      margin-top: 0.375rem;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      overflow-x: auto;
      color: var(--text);
    }
    .json-content.visible { display: block; }
    .composer {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .composer textarea {
      width: 100%;
      resize: none;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      font-family: 'Figtree', system-ui, sans-serif;
      min-height: 96px;
      outline: none;
    }
    .composer textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgb(60 30 235 / 0.12);
    }
    .composer .buttons { display: flex; flex-direction: column; gap: 0.5rem; }
    .composer button { width: 100%; }
    .status { font-size: 0.8rem; color: var(--text-muted); min-height: 1.1rem; }
    .pill {
      align-self: flex-start;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      color: var(--primary);
      background: #EEEBFC;
      border: 1px solid #CEC7FA;
      padding: 0.2rem 0.625rem;
      border-radius: 9999px;
    }
    .nav-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--muted);
    }
    .nav-bar button {
      flex: 1;
      height: 2.5rem;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
    }
    .nav-bar button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: var(--card);
    }
    .entries-screen { padding: 1rem; display: flex; flex-direction: column; gap: 0.625rem; }
    .entry-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.625rem 0.75rem;
      background: var(--card);
      font-size: 0.875rem;
    }
    .entry-card.rejected { border-left: 3px solid #E01541; background: #FEF2F4; }
    .entry-card.approved { border-left: 3px solid #0E9537; }
    .entry-card.clarified { border-left: 3px solid #F25A02; }
    .entry-meta { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .entry-status-badge { font-size: 0.7rem; font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 9999px; white-space: nowrap; }
    .badge-pending   { background: #F3F0F0; color: #7D95A1; }
    .badge-approved  { background: #F0FBF3; color: #0B6B2C; }
    .badge-rejected  { background: #FEF2F4; color: #9B0F2E; }
    .badge-clarified { background: #FFF8F0; color: #C04A00; }
    .clarify-form { margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.375rem; }
    .clarify-form textarea { font-family: inherit; font-size: 0.8rem; border-radius: var(--radius); border: 1px solid var(--border); padding: 0.375rem 0.5rem; resize: none; min-height: 60px; outline: none; }
    .clarify-form textarea:focus { border-color: var(--primary); }
    .clarify-actions { display: flex; gap: 0.375rem; }
    .clarify-actions button { height: 1.75rem; padding: 0 0.625rem; font-size: 0.75rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-family: inherit; font-weight: 500; }
    .clarify-actions .btn-clarify { background: var(--primary); color: #fff; border-color: var(--primary); }
    .clarify-actions .btn-delete  { color: #E01541; border-color: #F5AABB; }
    .entries-empty { color: var(--text-muted); font-size: 0.875rem; text-align: center; padding: 2rem 1rem; }
  </style>
</head>
<body>
  <main class="card">
    <section class="login" id="loginScreen" aria-live="polite">
      <h1>TimeTrackingApp</h1>
      <p>Kirjaudu henkilökohtaisella PIN-koodillasi.</p>
      <div class="pin-input">
        <input
          type="password"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          aria-label="PIN-koodi"
          id="pinInput"
        />
      </div>
      <button class="btn-primary" id="pinBtn">Kirjaudu</button>
      <div class="status" id="pinStatus"></div>

      <div id="debugBox" style="margin-top:0.875rem;padding:0.75rem;border-radius:6px;background:#FFF8F0;border:1px solid #F25A02;border-left:3px solid #F25A02;font-size:0.8rem;color:#283237;">
        <strong style="display:block;margin-bottom:0.375rem;color:#F25A02;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;">For testing / debug only</strong>
        <div id="debugContent" style="color:#5E7682;">Ladataan...</div>
      </div>
    </section>

    <!-- Nav bar (shown after login) -->
    <nav class="nav-bar hidden" id="navBar">
      <button id="navChatBtn" class="active">Kirjaa tunteja</button>
      <button id="navEntriesBtn">Tuntikirjaukset <span id="entriesAlertBadge" style="display:none;background:#E01541;color:#fff;border-radius:9999px;font-size:0.65rem;font-weight:700;padding:0.1rem 0.4rem;margin-left:0.25rem;vertical-align:middle;line-height:1.5;"></span></button>
    </nav>

    <section class="chat hidden" id="chatScreen">
      <div style="align-self:stretch;padding-bottom:0.625rem;border-bottom:2px solid var(--primary);margin-bottom:0.25rem;">
        <span id="employeeNameLabel" style="font-size:1rem;font-weight:700;color:#283237;letter-spacing:-0.01em;"></span>
      </div>
      <h1>Työtuntien kirjaus</h1>
      <div class="chat-area" id="chatArea"></div>
      <div class="composer">
        <textarea id="chatInput" placeholder="Kirjoita tai sanele esim. 15.11 klo 8–12 projekti Alfa."></textarea>
        <div class="buttons">
          <button id="micBtn" title="Sanelu">🎙 Sanele / nauhoita</button>
          <button class="btn-primary" id="sendBtn" title="Lähetä">➤ Lähetä</button>
        </div>
      </div>
      <div class="status" id="chatStatus">Valmis.</div>
    </section>

    <section class="entries-screen hidden" id="entriesScreen">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.25rem;">
        <strong style="font-size:0.9rem;">Omat kirjaukseni</strong>
        <button id="refreshEntriesBtn" style="height:1.75rem;padding:0 0.625rem;font-size:0.75rem;border-radius:6px;border:1px solid #C4CFD4;background:#fff;cursor:pointer;font-family:inherit;">↺ Päivitä</button>
      </div>
      <div id="entriesNotice" style="display:none;margin-bottom:0.75rem;"></div>
      <div id="myEntriesList"><div class="entries-empty">Ladataan...</div></div>
    </section>

    <div id="salaxyBrand" class="hidden" style="margin-top:1.5rem;display:flex;justify-content:center;padding-top:1rem;border-top:1px solid #E8E4E4;">
      <img src="https://static.wixstatic.com/media/4e9ff1_be4e966e9c6e49568cb04ccdba355512~mv2.png/v1/fill/w_126,h_40,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/4e9ff1_be4e966e9c6e49568cb04ccdba355512~mv2.png" alt="Salaxy" style="height:20px;width:auto;opacity:0.35;" />
    </div>

    <div id="loggedInDebugBox" class="hidden" style="margin-top:1rem;padding:0.75rem;border-radius:6px;background:#FFF8F0;border:1px solid #F25A02;border-left:3px solid #F25A02;font-size:0.8rem;color:#283237;">
      <strong style="display:block;margin-bottom:0.5rem;color:#F25A02;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;">For testing / debug only</strong>
      <button class="btn-salaxy" id="salaxyBtn" title="Lähetä tunnit Salaxyyn">📤 Lähetä Salaxyyn</button>
    </div>
  </main>

  <script>
    const APP_KEY     = "tT9#kL2$mN7@pQ4!23";
    const companySlug = window.location.pathname.split('/').filter(Boolean)[0] || '';
    let currentEmployee = null;

    fetch('/api/debug_credentials.php')
      .then(r => r.json())
      .then(data => {
        const el = document.getElementById('debugContent');
        if (!data.employees || data.employees.length === 0) {
          el.textContent = 'Ei työntekijöitä tietokannassa.';
          return;
        }
        el.innerHTML = '<strong>Työntekijä-PINit:</strong><br>' +
          data.employees.map(e =>
            `${e.name} (${e.company}): <code style="background:#fde68a;padding:1px 5px;border-radius:4px;">${e.pin}</code>`
          ).join('<br>');
      })
      .catch(() => {
        document.getElementById('debugContent').textContent = 'Debug-tietoja ei saatu.';
      });

    const loginScreen = document.getElementById("loginScreen");
    const chatScreen = document.getElementById("chatScreen");
    const pinInput = document.getElementById("pinInput");
    const pinBtn = document.getElementById("pinBtn");
    const pinStatus = document.getElementById("pinStatus");

    const chatArea = document.getElementById("chatArea");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatStatus = document.getElementById("chatStatus");
    
    // Salaxy-lähetystä varten
    let pendingEntries = [];
    const micBtn = document.getElementById("micBtn");
    const salaxyBtn = document.getElementById("salaxyBtn");

    let conversationHistory = [
      {
        role: "system",
        content:
          "Olet TimeTrackingApp tuntikirjausassistentti. Keskustele suomeksi. Pyydä käyttäjää tarkentamaan tarvittavat tiedot ja muodosta lopuksi JSON, joka sisältää päivämäärän, kellonajat, projektin ja tuntimäärän. Esimerkki: {\"entries\":[{\"date\":\"2025-11-15\",\"start\":\"08:00\",\"end\":\"12:00\",\"hours\":4,\"project\":\"Projekti Alfa\",\"notes\":\"Asennus\"}]}",
      },
    ];
    let recognition;

    function showError(el, msg) {
      el.textContent = msg;
      el.style.color = "var(--warning)";
    }
    function showSuccess(el, msg) {
      el.textContent = msg;
      el.style.color = "var(--success)";
    }

    function appendBubble(text, role = "assistant") {
      const div = document.createElement("div");
      div.className = `bubble ${role}`;
      
      // Piilota JSON toggle-elementin taakse assistant-viesteissä
      // Tue eri backtick-muotoja
      const jsonPattern = /(`{3}|\\`\\`\\`)json\s*([\s\S]*?)\s*(`{3}|\\`\\`\\`)/;
      const hasJson = jsonPattern.test(text);
      
      if (role === "assistant" && hasJson) {
        const parts = text.split(jsonPattern);
        const jsonMatch = text.match(jsonPattern);
        
        const textSpan = document.createElement("span");
        textSpan.textContent = parts[0].trim();
        div.appendChild(textSpan);
        
        if (jsonMatch) {
          const toggleLink = document.createElement("span");
          toggleLink.className = "json-toggle";
          toggleLink.textContent = "📋 Avaa JSON";
          
          const jsonContent = document.createElement("pre");
          jsonContent.className = "json-content";
          jsonContent.textContent = jsonMatch[2].trim();
          
          toggleLink.addEventListener("click", () => {
            jsonContent.classList.toggle("visible");
            toggleLink.textContent = jsonContent.classList.contains("visible") 
              ? "📋 Piilota JSON" 
              : "📋 Avaa JSON";
          });
          
          div.appendChild(document.createElement("br"));
          div.appendChild(toggleLink);
          div.appendChild(jsonContent);
        }
      } else {
        div.textContent = text;
      }
      
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function appendSalaxySuccess(result, partial = false) {
      const div = document.createElement("div");
      div.className = "bubble assistant";
      
      const title = partial 
        ? "Salaxy-synkronointi osittain onnistui!" 
        : "Salaxy-synkronointi onnistui!";
      
      const info = partial
        ? `Onnistui: ${result.totalSent}, Epäonnistui: ${result.totalFailed}`
        : `${result.totalSent} tuntikirjausta lisätty palkkalistalle.`;
      
      div.innerHTML = `<strong>${title}</strong><br>
${info}<br>
<strong>Palkkalista:</strong> ${result.payrollName || 'TimeTrackingApp'} (${result.draftDate})<br>
<a href="${result.payrollUrl}" target="_blank" style="color: #0066cc; text-decoration: underline;">DEBUG: Palkkalistan linkki Salaxyssä</a>`;
      
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function toggleLoading(isLoading, message = "") {
      chatStatus.textContent = message || (isLoading ? "Työstetään..." : "Valmis.");
      sendBtn.disabled = isLoading;
    }

    function parseJSONFromText(text) {
      // Tue eri backtick-muotoja (normaali, escaped, unicode)
      const patterns = [
        /```json\s*([\s\S]*?)\s*```/,
        /`{3}json\s*([\s\S]*?)\s*`{3}/,
        /\\`\\`\\`json\s*([\s\S]*?)\s*\\`\\`\\`/,
      ];
      
      for (const pattern of patterns) {
        const match = text.match(pattern);
        if (match) {
          try {
            return JSON.parse(match[1].trim());
          } catch (e) {
            console.warn("JSON-parsaus epäonnistui", e, match[1]);
          }
        }
      }
      return null;
    }

    async function persistEntries(structuredData) {
      try {
        // Save to local DB for approval workflow
        const res = await fetch("api/time_entries.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(structuredData),
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || "Tallennus epäonnistui");
        showSuccess(chatStatus, "Tunnit tallennettu.");
      } catch (error) {
        showError(chatStatus, `Tallennusvirhe: ${error.message}`);
      }
    }

    // ─── My entries view ──────────────────────────────────────────────────────
    const navBar          = document.getElementById("navBar");
    const navChatBtn      = document.getElementById("navChatBtn");
    const navEntriesBtn   = document.getElementById("navEntriesBtn");
    const entriesScreen   = document.getElementById("entriesScreen");
    const myEntriesList   = document.getElementById("myEntriesList");
    const refreshEntriesBtn = document.getElementById("refreshEntriesBtn");

    function switchTab(tab) {
      chatScreen.classList.toggle("hidden",    tab !== "chat");
      entriesScreen.classList.toggle("hidden", tab !== "entries");
      navChatBtn.classList.toggle("active",    tab === "chat");
      navEntriesBtn.classList.toggle("active", tab === "entries");
      if (tab === "entries") loadMyEntries();
    }
    navChatBtn.addEventListener("click",    () => switchTab("chat"));
    navEntriesBtn.addEventListener("click", () => switchTab("entries"));
    refreshEntriesBtn.addEventListener("click", loadMyEntries);

    function fmtDateFI(isoDate) {
      if (!isoDate) return '';
      const [y, m, d] = isoDate.split('-');
      return `${d}.${m}.${y}`;
    }
    function fmtDateTime(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('fi-FI',{day:'2-digit',month:'2-digit',year:'numeric'}) + ', klo ' +
             d.toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit'});
    }
    function escapeHtml(t) {
      return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadMyEntries() {
      myEntriesList.innerHTML = '<div class="entries-empty">Ladataan...</div>';
      try {
        const res    = await fetch("api/time_entries.php?view=mine");
        const result = await res.json();
        if (!res.ok || !result.success) { myEntriesList.innerHTML = '<div class="entries-empty">Virhe ladattaessa.</div>'; return; }
        renderMyEntries(result.entries || []);
      } catch { myEntriesList.innerHTML = '<div class="entries-empty">Verkkovirhe.</div>'; }
    }

    function updateEntriesAlert(entries) {
      const rejected  = entries.filter(e => e.status === 'rejected').length;
      const clarified = entries.filter(e => e.status === 'clarified').length;

      // Nav badge — shows count of entries requiring action
      const badge = document.getElementById('entriesAlertBadge');
      if (rejected > 0) {
        badge.textContent = rejected;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }

      // Notice banner inside entries screen
      const notice = document.getElementById('entriesNotice');
      const lines = [];
      if (rejected > 0)  lines.push(`<strong>${rejected} kirjaus${rejected  > 1 ? 'ta' : ''} hylätty</strong> — tarkista ja lähetä lisäselvitys`);
      if (clarified > 0) lines.push(`${clarified} selvitys${clarified > 1 ? 'tä' : ''} odottaa käsittelyä`);

      if (lines.length) {
        const color = rejected > 0 ? { bg:'#FEF2F4', border:'#F5AABB', text:'#9B0F2E', icon:'⚠' }
                                   : { bg:'#FFF8F0', border:'#F5C08A', text:'#7A3800', icon:'ℹ' };
        notice.innerHTML = `<div style="background:${color.bg};border:1px solid ${color.border};border-radius:8px;padding:0.625rem 0.875rem;font-size:0.8rem;color:${color.text};line-height:1.5;">${color.icon} ${lines.join(' &bull; ')}</div>`;
        notice.style.display = 'block';
      } else {
        notice.style.display = 'none';
      }
    }

    function renderMyEntries(entries) {
      updateEntriesAlert(entries);
      if (!entries.length) { myEntriesList.innerHTML = '<div class="entries-empty">Ei kirjauksia.</div>'; return; }
      myEntriesList.innerHTML = entries.map(e => {
        const badgeClass = { pending:'badge-pending', approved:'badge-approved', rejected:'badge-rejected', clarified:'badge-clarified' }[e.status] || 'badge-pending';
        const badgeText  = { pending:'Odottaa', approved:'✓ Hyväksytty', rejected:'✗ Hylätty', clarified:'↩ Selvitetty' }[e.status] || e.status;
        const rejNote    = e.rejection_note ? `<div style="font-size:0.75rem;color:#9B0F2E;margin-top:0.25rem;border-left:2px solid #E01541;padding-left:0.4rem">Syy: ${escapeHtml(e.rejection_note)}</div>` : '';
        const clarNote   = e.employee_clarification ? `<div style="font-size:0.75rem;color:#C04A00;margin-top:0.25rem;border-left:2px solid #F25A02;padding-left:0.4rem">Selvitys: ${escapeHtml(e.employee_clarification)}</div>` : '';
        const clarifyBtn = e.status === 'rejected' ? `
          <div class="clarify-form" id="clarifyForm_${e.id}" style="display:none;">
            <textarea id="clarifyText_${e.id}" placeholder="Kirjoita selvitys..."></textarea>
            <div class="clarify-actions">
              <button class="btn-clarify" onclick="submitClarification(${e.id})">Lähetä selvitys</button>
              <button class="btn-delete"  onclick="deleteEntry(${e.id})">Poista kirjaus</button>
              <button onclick="document.getElementById('clarifyForm_${e.id}').style.display='none'">Peruuta</button>
            </div>
          </div>
          <button onclick="document.getElementById('clarifyForm_${e.id}').style.display='flex'" style="margin-top:0.375rem;height:1.5rem;padding:0 0.5rem;font-size:0.7rem;font-weight:600;border-radius:4px;border:1px solid #E01541;background:#FEF2F4;color:#E01541;cursor:pointer;font-family:inherit;">⚠ Lisäselvitys!</button>` : '';
        return `<div class="entry-card ${e.status}">
          <div class="entry-meta">
            <span>${fmtDateFI(e.entry_date)}${e.start_time ? ' ' + e.start_time : ''}${e.end_time ? '–' + e.end_time : ''} · ${parseFloat(e.hours).toFixed(1)}h${parseFloat(e.km)>0?' / '+e.km+'km':''}</span>
            <span class="entry-status-badge ${badgeClass}">${badgeText}</span>
          </div>
          ${e.project ? `<div style="color:#5E7682;font-size:0.8rem;margin-top:0.125rem;">${escapeHtml(e.project)}</div>` : ''}
          ${e.comment ? `<div style="color:#7D95A1;font-size:0.75rem;">${escapeHtml(e.comment)}</div>` : ''}
          ${rejNote}${clarNote}${clarifyBtn}
          ${e.exported_to_salaxy ? `<div style="font-size:0.72rem;color:#3C1EEB;margin-top:0.25rem;">Viety palkkalistalle ${fmtDateTime(e.exported_at)}</div>` : ''}
        </div>`;
      }).join('');
    }

    async function submitClarification(id) {
      const text = document.getElementById(`clarifyText_${id}`)?.value?.trim();
      if (!text) return;
      try {
        const res    = await fetch("api/clarify_entry.php", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, action: "clarify", clarification: text }),
        });
        const result = await res.json();
        if (result.success) loadMyEntries();
        else alert(result.error || 'Virhe.');
      } catch { alert('Verkkovirhe.'); }
    }

    async function deleteEntry(id) {
      if (!confirm('Poistetaanko kirjaus?')) return;
      try {
        const res    = await fetch("api/clarify_entry.php", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, action: "delete" }),
        });
        const result = await res.json();
        if (result.success) loadMyEntries();
        else alert(result.error || 'Virhe.');
      } catch { alert('Verkkovirhe.'); }
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      appendBubble(text, "user");
      conversationHistory.push({ role: "user", content: text });
      chatInput.value = "";
      toggleLoading(true, "Kysytään assistentilta...");

      try {
        const res = await fetch("llm_proxy.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history: conversationHistory.slice(-12) }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "LLM-virhe");
        const reply = data.reply || "En saanut vastausta.";
        appendBubble(reply, "assistant");
        conversationHistory.push({ role: "assistant", content: reply });

        const structured = parseJSONFromText(reply);
        if (structured?.entries?.length) {
          const action = structured.action || "new";
          
          if (action === "update" && pendingEntries.length > 0) {
            // Korjaus: korvaa viimeisin kirjaus
            pendingEntries.pop();
            pendingEntries = pendingEntries.concat(structured.entries);
            console.log("Päivitetty pendingEntries:", structured.entries, "Yhteensä:", pendingEntries.length);
            showSuccess(chatStatus, "Kirjaus päivitetty.");
          } else {
            // Uusi kirjaus
            pendingEntries = pendingEntries.concat(structured.entries);
            console.log("Lisätty pendingEntries:", structured.entries, "Yhteensä:", pendingEntries.length);
            showSuccess(chatStatus, `${structured.entries.length} tuntikirjaus(ta) tallennettu.`);
          }
          
          // Tallenna myös paikallisesti (aina uutena, historia säilyy)
          await persistEntries(structured);
        } else {
          // Ei JSON-lohkoa = assistentti kysyy tarkennusta, ei virhettä
          showSuccess(chatStatus, "Odottaa tarkennusta...");
        }
      } catch (error) {
        console.error(error);
        showError(chatStatus, `Virhe: ${error.message}`);
        sendBtn.disabled = false; // Palauta nappi käyttöön ilman "Valmis"-tekstiä
        return; // Älä ylikirjoita virheviestiä
      }
      toggleLoading(false);
    }

    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        micBtn.disabled = true;
        micBtn.title = "Selain ei tue sanelua";
        return;
      }
      recognition = new SpeechRecognition();
      recognition.lang = "fi-FI";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        chatInput.value = chatInput.value
          ? `${chatInput.value.trim()} ${transcript}`
          : transcript;
      };
      recognition.onerror = () => {
        showError(chatStatus, "Sanelu epäonnistui.");
      };
      recognition.onend = () => {
        micBtn.textContent = "🎙️";
      };

      micBtn.addEventListener("click", () => {
        if (micBtn.textContent === "⏹️") {
          recognition.stop();
          return;
        }
        recognition.start();
        micBtn.textContent = "⏹️";
        showSuccess(chatStatus, "Kuunnellaan...");
      });
    }

    pinBtn.addEventListener("click", async () => {
      const pin = pinInput.value.trim();
      if (!pin) {
        showError(pinStatus, "Syötä PIN-koodi.");
        pinInput.focus();
        return;
      }
      
      pinBtn.disabled = true;
      showSuccess(pinStatus, "Tarkistetaan...");
      
      try {
        const res = await fetch("validate_pin.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin, slug: companySlug }),
        });
        const data = await res.json();

        if (data.valid) {
          currentEmployee = data;
          loginScreen.classList.add("hidden");
          navBar.classList.remove("hidden");
          chatScreen.classList.remove("hidden");
          document.getElementById('loggedInDebugBox').classList.remove('hidden');
          document.getElementById('salaxyBrand').classList.remove('hidden');
          chatStatus.textContent = '';
          document.getElementById('employeeNameLabel').textContent = data.name;
          loadMyEntries(); // silently populate the entries badge in the background
          appendBubble(
            "Kerro milloin teit tunteja ja mille projektille. Muotoilen ne tuntikirjauksiksi ja voit lähettää ne hyväksyttäviksi.\n\nEsim: 'Tänään klo 9-12, Projekti Alfa'. Voit syöttää tunteja myös antamalla päivämääriä ja loppuun voi antaa oman kommenttisi.\n\nEsim: '15.11 klo 8-12 projekti Bravo kommentti: Meni ennakoitua pidempään'"
          );
        } else {
          showError(pinStatus, data.error || "Väärä PIN. Yritä uudelleen.");
          pinInput.focus();
        }
      } catch (error) {
        console.error("PIN validation error:", error);
        showError(pinStatus, "Virhe kirjautumisessa. Yritä uudelleen.");
      } finally {
        pinBtn.disabled = false;
      }
    });

    // Lisää tämä - Enter-näppäin PIN-kentässä
    pinInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        pinBtn.click();
      }
    });

    sendBtn.addEventListener("click", sendMessage);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Salaxy sync -toiminto
    async function syncToSalaxy() {
      if (pendingEntries.length === 0) {
        showError(chatStatus, "Ei lähetettäviä tunteja. Kirjaa ensin tunteja.");
        return;
      }
      
      salaxyBtn.disabled = true;
      showSuccess(chatStatus, "Lähetetään Salaxyyn...");
      
      try {
        const res = await fetch("salaxy_sync.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-App-Key": APP_KEY,
          },
          body: JSON.stringify({ 
            entries: pendingEntries,
            employmentId: currentEmployee?.employmentId || null
          }),
        });
        const result = await res.json();
        
        if (res.ok && result.totalFailed === 0) {
          showSuccess(chatStatus, `✅ ${result.totalSent} tuntikirjausta lisätty palkkalistalle!`);
          appendSalaxySuccess(result);
          pendingEntries = []; // Tyhjennä lähetetyt
        } else if (result.totalSent > 0) {
          showError(chatStatus, `⚠️ ${result.totalSent} onnistui, ${result.totalFailed} epäonnistui`);
          appendSalaxySuccess(result, true);
        } else {
          const err = new Error(result.errors?.[0]?.error || result.message || "Lähetys epäonnistui");
          err.debug = result.debug;
          throw err;
        }
      } catch (error) {
        console.error("Salaxy sync error:", error);
        showError(chatStatus, `Salaxy-virhe: ${error.message}`);
        // Näytä debug-tiedot konsolissa
        if (error.debug) {
          console.error("Salaxy API debug:", error.debug);
        }
      } finally {
        salaxyBtn.disabled = false;
      }
    }
    
    salaxyBtn.addEventListener("click", syncToSalaxy);

    document.addEventListener("DOMContentLoaded", initSpeech);
  </script>
</body>
</html>
