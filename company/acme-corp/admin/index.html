<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeTrackingApp Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #EDE8E8; --card: #FFFFFF; --text: #283237; --text-muted: #5E7682;
      --primary: #3C1EEB; --success: #0E9537; --border: #C4CFD4;
      --input-bg: #FFFFFF; --muted: #F3F0F0; --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; line-height: 1.5;
      display: flex; justify-content: center; align-items: flex-start; padding: 2.5rem 1.5rem; }
    .card { width: min(860px, 100%); padding: 1.5rem; border-radius: 8px; background: var(--card);
      border: 1px solid var(--border); box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }
    h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
    h2 { font-size: 0.9375rem; font-weight: 600; margin-bottom: 0.75rem; }
    .field { display: flex; flex-direction: column; gap: 0.375rem; margin-bottom: 0.875rem; }
    label { font-size: 0.875rem; font-weight: 500; color: var(--text); }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; height: 2.25rem; padding: 0 0.75rem; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--input-bg); color: var(--text);
      font-family: 'Figtree', system-ui, sans-serif; font-size: 0.875rem; outline: none; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgb(60 30 235 / 0.12); }
    button { cursor: pointer; font-family: 'Figtree', system-ui, sans-serif; font-size: 0.875rem;
      font-weight: 500; height: 2.25rem; padding: 0 1rem; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      transition: background 0.15s; display: inline-flex; align-items: center;
      justify-content: center; white-space: nowrap; gap: 0.375rem; }
    button:hover { background: var(--muted); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: #2F18BC; border-color: #2F18BC; }
    #loginBtn { width: 100%; height: 2.5rem; margin-top: 0.25rem;
      background: var(--primary); color: #fff; border-color: var(--primary); }
    #loginBtn:hover { background: #2F18BC; border-color: #2F18BC; }
    .secondary { width: auto; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1rem; margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .dashboard-header > div { display: flex; flex-direction: column; gap: 0.25rem; }
    .header-actions { display: flex; gap: 0.5rem; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
    .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--muted); }
    th { text-align: left; padding: 0.5rem 0.75rem; font-size: 0.75rem; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border); }
    td { padding: 0.625rem 0.75rem; font-size: 0.875rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--muted); }
    .employee-form { margin-top: 1.25rem; padding: 1rem; border-radius: var(--radius);
      background: var(--muted); border: 1px solid var(--border); }
    .employee-form.hidden { display: none; }
    input[type="checkbox"] { width: 1rem; height: 1rem; accent-color: var(--primary); }
    .form-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .form-buttons button { flex: 1; min-width: 100px; }
    .action-buttons { display: flex; gap: 0.375rem; flex-wrap: wrap; }
    .action-btn { height: 1.75rem; padding: 0 0.625rem; font-size: 0.75rem; font-weight: 500;
      font-family: 'Figtree', system-ui, sans-serif; background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer;
      display: inline-flex; align-items: center; transition: background 0.15s; white-space: nowrap; }
    .action-btn:hover { background: var(--muted); }
    .modal { display: none; position: fixed; inset: 0; background: rgb(0 0 0 / 0.45);
      z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
    .modal.visible { display: flex; }
    .modal-content { background: var(--card); border-radius: 8px; border: 1px solid var(--border);
      padding: 1.5rem; width: 100%; box-shadow: 0 4px 16px rgb(0 0 0 / 0.12); max-height: 90vh; overflow-y: auto; }
    .modal-content.sm { max-width: 400px; }
    .modal-content.md { max-width: 560px; }
    .modal-content.lg { max-width: 820px; }
    .modal h2 { font-size: 1rem; margin-bottom: 0.875rem; }
    .modal-buttons { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
    .modal-buttons button { flex: 1; }
    #copyPinBtn { background: var(--primary); color: #fff; border-color: var(--primary); }
    #copyPinBtn:hover { background: #2F18BC; }
    .status { margin-top: 0.75rem; min-height: 1.1rem; font-size: 0.8rem; color: var(--text-muted); }
    .hidden { display: none !important; }
    .section-header { display: flex; justify-content: space-between; align-items: center;
      margin: 1.5rem 0 0.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
    #langBar { display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap;
      margin-top: 0.375rem; font-size: 0.8rem; color: var(--text-muted); }
    #langBar > div { display: flex; align-items: center; gap: 0.375rem; }
  </style>
</head>
<body>
<main class="card">
  <!-- Brand -->
  <div style="margin-bottom:1rem;padding-bottom:0.875rem;border-bottom:1px solid var(--border);">
    <img src="https://static.wixstatic.com/media/4e9ff1_be4e966e9c6e49568cb04ccdba355512~mv2.png/v1/fill/w_126,h_40,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/4e9ff1_be4e966e9c6e49568cb04ccdba355512~mv2.png" alt="Salaxy" style="height:28px;width:auto;display:block;" />
  </div>

  <!-- Login -->
  <section id="loginSection">
    <h1 data-i18n="admin.login_title"></h1>
    <div class="field">
      <label for="email" data-i18n="login.email_label"></label>
      <input id="email" type="email" placeholder="admin@example.com" autocomplete="username" />
    </div>
    <div class="field">
      <label for="password" data-i18n="login.password_label"></label>
      <input id="password" type="password" data-i18n-placeholder="login.password_label" autocomplete="current-password" />
    </div>
    <button id="loginBtn" data-i18n="login.sign_in_button"></button>
    <div class="status" id="status"></div>
    <div style="margin-top:0.875rem;padding:0.75rem;border-radius:6px;background:#FFF8F0;border:1px solid #F25A02;border-left:3px solid #F25A02;font-size:0.8rem;color:#283237;">
      <strong style="display:block;margin-bottom:0.375rem;color:#F25A02;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;">For testing / debug only</strong>
      <div id="debugContent" style="color:#5E7682;" data-i18n="common.loading"></div>
    </div>
  </section>

  <!-- Dashboard -->
  <section id="dashboard" class="hidden">
    <div class="dashboard-header">
      <div>
        <h1 data-i18n="admin.employees_title"></h1>
        <p data-i18n="admin.employees_subtitle"></p>
        <p style="font-size:0.9rem;color:#666;"><span data-i18n="common.logged_in_as"></span> <strong id="adminName"></strong></p>
        <div id="langBar" class="hidden">
          <div>
            <span data-i18n="language.company_language_label"></span>
            <span id="companyLangContainer"></span>
          </div>
          <div>
            <span data-i18n="language.personal_language_label"></span>
            <span id="adminLangContainer"></span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button id="logoutBtn" class="secondary" data-i18n="common.logout"></button>
      </div>
    </div>

    <!-- Action bar -->
    <div style="margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;">
      <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;">
        <button id="exportPayrollBtn" class="btn-primary hidden" data-i18n="admin.export_payroll"></button>
        <button id="payrollSettingsBtn" data-i18n="admin.payroll_settings"></button>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.25rem;">
        <button id="syncSalaxyBtn" class="btn-primary" data-i18n="admin.sync_from_salaxy"></button>
        <span id="lastSyncInfo" style="font-size:0.8rem;color:#7D95A1;"></span>
      </div>
    </div>

    <!-- Employees table -->
    <div class="table-wrapper">
      <table id="employeesTable">
        <thead>
          <tr>
            <th style="width:2.5rem;text-align:center;" data-i18n="admin.col_active"></th>
            <th data-i18n="admin.col_name"></th>
            <th data-i18n="admin.col_pin"></th>
            <th data-i18n="admin.col_ssn"></th>
            <th data-i18n="admin.col_employment_id"></th>
            <th data-i18n="admin.col_actions"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Employee form -->
    <form id="employeeForm" class="employee-form hidden">
      <h2 id="formTitle" data-i18n="admin.add_employee_title"></h2>
      <div class="field"><label for="employeeName" data-i18n="admin.col_name"></label><input id="employeeName" type="text" /></div>
      <div class="field"><label for="employeePin" data-i18n="admin.col_pin"></label><input id="employeePin" type="text" maxlength="6" /></div>
      <div class="field"><label for="employeeSsn" data-i18n="admin.col_ssn"></label><input id="employeeSsn" type="text" /></div>
      <div class="field"><label for="employeeEmploymentId" data-i18n="admin.col_employment_id"></label><input id="employeeEmploymentId" type="text" /></div>
      <div class="field">
        <label for="employeeLang" data-i18n="admin.language_label"></label>
        <select id="employeeLang" style="height:2.25rem;border-radius:var(--radius);border:1px solid var(--border);font-family:inherit;font-size:0.875rem;padding:0 0.625rem;background:#fff;width:100%;">
          <option value="" data-i18n="common.lang_default"></option>
          <option value="en">English</option>
          <option value="fi">Suomi</option>
          <option value="sv">Svenska</option>
          <option value="et">Eesti</option>
          <option value="uk">Українська</option>
          <option value="xh">isiXhosa</option>
        </select>
      </div>
      <div class="form-buttons">
        <button id="saveEmployeeBtn" type="button" class="btn-primary" data-i18n="common.save"></button>
        <button id="cancelEmployeeBtn" type="button" class="secondary" data-i18n="common.cancel"></button>
      </div>
    </form>

    <!-- Supervisors section (shown only if approvals_enabled) -->
    <div id="supervisorsSection" class="hidden">
      <div class="section-header">
        <h2 style="margin:0;" data-i18n="admin.supervisors_title"></h2>
        <button id="addSupervisorBtn" class="btn-primary" data-i18n="admin.add_supervisor"></button>
      </div>
      <div class="table-wrapper">
        <table>
          <thead><tr>
            <th data-i18n="supervisor.col_name"></th>
            <th data-i18n="supervisor.col_email"></th>
            <th data-i18n="supervisor.col_phone"></th>
            <th data-i18n="supervisor.col_pin"></th>
            <th data-i18n="supervisor.col_actions"></th>
          </tr></thead>
          <tbody id="supervisorsTbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Debug: manual add -->
    <div style="margin-top:1.5rem;padding:0.75rem;border-radius:6px;background:#FFF8F0;border:1px solid #F25A02;border-left:3px solid #F25A02;">
      <strong style="display:block;margin-bottom:0.25rem;color:#F25A02;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;">For testing / debug only</strong>
      <p id="debugManualNote" style="font-size:0.8rem;color:#5E7682;margin-bottom:0.625rem;" data-i18n="admin.employees_subtitle"></p>
      <button id="newEmployeeBtn" style="height:2rem;padding:0 0.75rem;font-size:0.8rem;border-radius:6px;border:1px solid #F25A02;background:#FFF8F0;color:#C04A00;font-family:inherit;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;" data-i18n="admin.add_employee"></button>
    </div>
  </section>
</main>

<!-- PIN reset modal -->
<div id="pinResetModal" class="modal">
  <div class="modal-content sm">
    <h2 data-i18n="admin.pin_reset_title"></h2>
    <p><span data-i18n="admin.employee_label"></span> <strong id="resetEmployeeName"></strong></p>
    <p><span data-i18n="admin.new_pin_label"></span> <strong id="newPin" style="font-size:1.2em;color:#0f4c81;"></strong></p>
    <p data-i18n="admin.pin_reset_note"></p>
    <div class="modal-buttons">
      <button id="copyPinBtn" data-i18n="admin.copy_pin"></button>
      <button id="closePinModalBtn" class="secondary" data-i18n="common.close"></button>
    </div>
  </div>
</div>

<!-- Entries review modal -->
<div id="entriesModal" class="modal">
  <div class="modal-content lg">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h2 id="entriesModalTitle" style="margin:0;"></h2>
      <button id="closeEntriesModal" class="secondary" style="flex-shrink:0;">✕ <span data-i18n="common.close"></span></button>
    </div>

    <!-- Bulk actions bar -->
    <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;margin-bottom:0.75rem;">
      <label style="display:flex;align-items:center;gap:0.375rem;font-size:0.8rem;cursor:pointer;">
        <input type="checkbox" id="selectAllEntries" style="accent-color:#3C1EEB;"> <span data-i18n="entries.select_all"></span>
      </label>
      <button id="approveSelectedBtn" class="action-btn" style="color:#0E9537;border-color:#A7E3B5;" data-i18n="entries.approve_selected"></button>
      <button id="rejectSelectedBtn"  class="action-btn" style="color:#E01541;border-color:#F5AABB;" data-i18n="entries.reject_selected"></button>
      <select id="entriesGrouping" style="height:1.75rem;border-radius:6px;border:1px solid #C4CFD4;font-family:inherit;font-size:0.8rem;padding:0 0.5rem;background:#fff;">
        <option value="day" data-i18n="grouping.day"></option>
        <option value="week" selected data-i18n="grouping.week"></option>
        <option value="month" data-i18n="grouping.month"></option>
        <option value="year" data-i18n="grouping.year"></option>
      </select>
    </div>

    <!-- Reject reason dialog (inline) -->
    <div id="rejectDialog" class="hidden" style="background:#FEF2F4;border:1px solid #F5AABB;border-radius:6px;padding:0.75rem;margin-bottom:0.75rem;">
      <p style="font-size:0.8rem;margin-bottom:0.5rem;font-weight:500;" data-i18n="entries.rejection_reason_prompt"></p>
      <input type="text" id="rejectNoteInput" data-i18n-placeholder="entries.rejection_placeholder" style="width:100%;height:2rem;padding:0 0.625rem;border-radius:6px;border:1px solid #F5AABB;font-family:inherit;font-size:0.8rem;background:#fff;" />
      <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
        <button id="confirmRejectBtn" style="height:1.75rem;padding:0 0.75rem;font-size:0.8rem;background:#E01541;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:500;" data-i18n="entries.reject"></button>
        <button id="cancelRejectBtn"  style="height:1.75rem;padding:0 0.75rem;font-size:0.8rem;background:#fff;border:1px solid #C4CFD4;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:500;" data-i18n="common.cancel"></button>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead><tr>
          <th style="width:2rem;text-align:center;"></th>
          <th data-i18n="entries.col_date"></th>
          <th data-i18n="entries.col_time"></th>
          <th data-i18n="entries.col_hours"></th>
          <th data-i18n="entries.col_project"></th>
          <th data-i18n="entries.col_status"></th>
          <th data-i18n="admin.col_actions"></th>
        </tr></thead>
        <tbody id="entriesTbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Supervisor modal -->
<div id="supervisorModal" class="modal">
  <div class="modal-content md">
    <h2 id="supModalTitle" data-i18n="admin.add_supervisor_title"></h2>
    <div class="form-row">
      <div class="field"><label data-i18n="supervisor.first_name_label"></label><input id="supFirstName" type="text" /></div>
      <div class="field"><label data-i18n="supervisor.last_name_label"></label><input id="supLastName" type="text" /></div>
    </div>
    <div class="form-row">
      <div class="field"><label data-i18n="supervisor.email_label"></label><input id="supEmail" type="text" /></div>
      <div class="field"><label data-i18n="supervisor.phone_label"></label><input id="supPhone" type="text" /></div>
    </div>
    <div class="form-row">
      <div class="field"><label data-i18n="supervisor.pin_label"></label><input id="supPin" type="text" maxlength="6" /></div>
      <div class="field"><label data-i18n="supervisor.ssn_label"></label><input id="supSsn" type="text" /></div>
    </div>
    <div class="field"><label data-i18n="supervisor.salaxy_id_label"></label><input id="supSalaxyId" type="text" /></div>
    <div class="field">
      <label for="supLang" data-i18n="admin.language_label"></label>
      <select id="supLang" style="height:2.25rem;border-radius:var(--radius);border:1px solid var(--border);font-family:inherit;font-size:0.875rem;padding:0 0.625rem;background:#fff;width:100%;">
        <option value="" data-i18n="common.lang_default"></option>
        <option value="en">English</option>
        <option value="fi">Suomi</option>
        <option value="sv">Svenska</option>
        <option value="et">Eesti</option>
        <option value="uk">Українська</option>
        <option value="xh">isiXhosa</option>
      </select>
    </div>
    <div class="modal-buttons">
      <button id="saveSupervisorBtn" class="btn-primary" data-i18n="common.save"></button>
      <button id="closeSupervisorModal" class="secondary" data-i18n="common.cancel"></button>
    </div>
  </div>
</div>

<!-- Team modal -->
<div id="teamModal" class="modal">
  <div class="modal-content md">
    <h2 id="teamModalTitle"></h2>
    <p id="teamModalSubtitle" style="font-size:0.8rem;color:#7D95A1;margin-bottom:0.875rem;" data-i18n="admin.team_modal_subtitle"></p>
    <div id="teamList" style="max-height:340px;overflow-y:auto;"></div>
    <div class="modal-buttons">
      <button id="saveTeamBtn" class="btn-primary" data-i18n="admin.save_team"></button>
      <button id="closeTeamModal" class="secondary" data-i18n="common.cancel"></button>
    </div>
  </div>
</div>

<!-- Payroll settings modal -->
<div id="payrollSettingsModal" class="modal">
  <div class="modal-content sm">
    <h2 data-i18n="payroll.title"></h2>

    <div class="field">
      <label data-i18n="payroll.period_label"></label>
      <div style="display:flex;flex-direction:column;gap:0.5rem;margin-top:0.25rem;">
        <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-weight:400;font-size:0.875rem;">
          <input type="radio" name="payrollPeriod" value="monthly" id="periodMonthly" style="accent-color:var(--primary);"> <span data-i18n="payroll.monthly"></span>
        </label>
        <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-weight:400;font-size:0.875rem;">
          <input type="radio" name="payrollPeriod" value="biweekly" id="periodBiweekly" style="accent-color:var(--primary);"> <span data-i18n="payroll.biweekly"></span>
        </label>
      </div>
    </div>

    <div id="settingsMonthly">
      <div class="field">
        <label for="monthlyPayday" data-i18n="payroll.payday_label"></label>
        <select id="monthlyPayday" style="height:2.25rem;border-radius:6px;border:1px solid #C4CFD4;font-family:inherit;font-size:0.875rem;padding:0 0.625rem;background:#fff;width:100%;"></select>
      </div>
    </div>

    <div id="settingsBiweekly" class="hidden">
      <div class="field">
        <label for="biweeklyPayday1"><span data-i18n="payroll.payday1_label"></span> <span style="font-weight:400;color:#7D95A1;font-size:0.8rem;" data-i18n="payroll.payday1_hint"></span></label>
        <select id="biweeklyPayday1" style="height:2.25rem;border-radius:6px;border:1px solid #C4CFD4;font-family:inherit;font-size:0.875rem;padding:0 0.625rem;background:#fff;width:100%;"></select>
      </div>
      <div class="field">
        <label for="biweeklyPayday2"><span data-i18n="payroll.payday2_label"></span> <span style="font-weight:400;color:#7D95A1;font-size:0.8rem;" data-i18n="payroll.payday2_hint"></span></label>
        <select id="biweeklyPayday2" style="height:2.25rem;border-radius:6px;border:1px solid #C4CFD4;font-family:inherit;font-size:0.875rem;padding:0 0.625rem;background:#fff;width:100%;"></select>
      </div>
    </div>

    <div class="modal-buttons">
      <button id="closePayrollSettingsModal" class="secondary" data-i18n="common.cancel"></button>
      <button id="savePayrollSettingsBtn" class="btn-primary" data-i18n="common.save"></button>
    </div>
  </div>
</div>

<!-- Payroll export modal -->
<div id="payrollModal" class="modal">
  <div class="modal-content lg">
    <h2 data-i18n="payroll.export_title"></h2>
    <div style="display:flex;gap:0.75rem;align-items:flex-end;flex-wrap:wrap;margin-bottom:1rem;">
      <div class="field" style="margin:0;flex:1;min-width:130px;">
        <label data-i18n="payroll.date_from"></label>
        <input type="date" id="payrollDateFrom" style="height:2.25rem;padding:0 0.625rem;border-radius:6px;border:1px solid #C4CFD4;font-family:inherit;font-size:0.875rem;width:100%;" />
      </div>
      <div class="field" style="margin:0;flex:1;min-width:130px;">
        <label data-i18n="payroll.date_to"></label>
        <input type="date" id="payrollDateTo" style="height:2.25rem;padding:0 0.625rem;border-radius:6px;border:1px solid #C4CFD4;font-family:inherit;font-size:0.875rem;width:100%;" />
      </div>
      <button id="payrollPreviewBtn" class="btn-primary" style="flex-shrink:0;" data-i18n="payroll.fetch_approved"></button>
    </div>
    <div id="payrollPreview"></div>
    <div style="margin-top:1rem;display:flex;gap:0.75rem;flex-wrap:wrap;">
      <button id="exportToSalaxy" class="btn-primary hidden" style="background:#0E9537;border-color:#0E9537;" data-i18n="payroll.export_to_salaxy"></button>
      <button id="forceExportToSalaxy" class="btn-primary hidden" style="background:#E07B00;border-color:#E07B00;" data-i18n="payroll.re_export_to_salaxy"></button>
    </div>
    <div style="margin-top:0.875rem;">
      <button id="closePayrollModal" class="secondary" data-i18n="payroll.close"></button>
    </div>
  </div>
</div>

<script src="/js/i18n.js"></script>
<script>
  const slug = window.location.pathname.split('/').filter(Boolean)[0] || '';
  initPageLang(slug);

  fetch('/api/debug_credentials.php')
    .then(r => r.json())
    .then(data => {
      const el = document.getElementById('debugContent');
      const admins    = (data.admins    || []).filter(a => a.slug === slug);
      const employees = (data.employees || []).filter(e => e.slug === slug);
      let html = '';
      if (admins.length) {
        html += `<strong>${i18n.t('admin.debug_employees_label').replace('PIN', 'Admin-tunnus:').replace(/PIN.*/, '')}</strong>`;
        html = `<strong>Admin:</strong><br>` +
          admins.map(a => `${a.email}${a.email === 'admin@timeapp.local' ? ' / <code style="background:#fde68a;padding:1px 5px;border-radius:4px;">Admin123!</code>' : ''}`).join('<br>');
      }
      if (employees.length) {
        html += (html ? '<br><br>' : '') + `<strong>${i18n.t('admin.debug_employees_label')}</strong><br>` +
          employees.map(e => `${e.name}: <code style="background:#fde68a;padding:1px 5px;border-radius:4px;">${e.pin}</code>`).join('<br>');
      }
      el.innerHTML = html || i18n.t('admin.debug_no_data');
    })
    .catch(() => { document.getElementById('debugContent').textContent = i18n.t('admin.debug_no_data'); });
</script>
<script src="admin.js"></script>
</body>
</html>
