<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeTrackingApp – Super Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #EDE8E8;
      --card: #FFFFFF;
      --text: #283237;
      --text-muted: #5E7682;
      --primary: #3C1EEB;
      --success: #0E9537;
      --destructive: #E01541;
      --border: #C4CFD4;
      --input-bg: #FFFFFF;
      --muted: #F3F0F0;
      --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Figtree', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2.5rem 1.5rem;
    }
    .container { width: min(860px, 100%); }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .page-header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
    .page-header p { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.125rem; }
    .header-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .card {
      background: var(--card);
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
      margin-bottom: 1.25rem;
      overflow: hidden;
    }
    .card-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--muted);
    }
    button {
      cursor: pointer;
      font-family: 'Figtree', system-ui, sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      height: 2.25rem;
      padding: 0 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      transition: background 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      gap: 0.375rem;
    }
    button:hover { background: var(--muted); }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-primary:hover { background: #2F18BC; border-color: #2F18BC; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--card); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: var(--muted); }
    /* Table */
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--muted); }
    th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 0.625rem 0.75rem;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--muted); }
    .action-btn {
      height: 1.75rem;
      padding: 0 0.625rem;
      font-size: 0.75rem;
      font-weight: 500;
      font-family: 'Figtree', system-ui, sans-serif;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .action-btn:hover { background: var(--muted); }
    /* Forms */
    .form-group { margin-bottom: 0.875rem; }
    label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; color: var(--text); }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      height: 2.25rem;
      padding: 0 0.75rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-family: 'Figtree', system-ui, sans-serif;
      font-size: 0.875rem;
      outline: none;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgb(60 30 235 / 0.12); }
    small { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; display: block; }
    /* Status */
    .status { font-size: 0.8rem; padding: 0.5rem 0.75rem; border-radius: var(--radius); display: none; margin-bottom: 0.875rem; }
    .status.visible { display: block; }
    .status.success { background: #F0FBF3; border: 1px solid #A7E3B5; color: #0B6B2C; }
    .status.error { background: #FEF2F4; border: 1px solid #F5AABB; color: #9B0F2E; }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgb(0 0 0 / 0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal.visible { display: flex; }
    .modal-content {
      background: var(--card);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 1.5rem;
      max-width: 440px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 4px 16px rgb(0 0 0 / 0.12);
    }
    .modal h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
    .modal-footer { display: flex; gap: 0.5rem; margin-top: 1.25rem; }
    .modal-footer button { flex: 1; }
    .empty { color: var(--text-muted); font-size: 0.875rem; padding: 1rem 0.75rem; }
  </style>
</head>
<body>
  <div class="container" style="background:var(--card);border-radius:8px;border:1px solid var(--border);box-shadow:0 1px 3px rgb(0 0 0/0.08);padding:1.5rem;">

    <!-- Brand -->
    <div style="margin-bottom:1rem;padding-bottom:0.875rem;border-bottom:1px solid var(--border);">
      <img src="https://static.wixstatic.com/media/4e9ff1_be4e966e9c6e49568cb04ccdba355512~mv2.png/v1/fill/w_126,h_40,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/4e9ff1_be4e966e9c6e49568cb04ccdba355512~mv2.png" alt="Salaxy" style="height:28px;width:auto;display:block;" />
    </div>

    <div class="page-header">
      <div>
        <h1>TimeTrackingApp – Super Admin</h1>
        <p>Manage companies and their admin users</p>
      </div>
      <div class="header-actions">
        <button class="btn-primary" id="newCompanyBtn">+ New company</button>
        <button class="btn-secondary" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="status" id="status"></div>

    <div style="overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);">
      <table id="companiesTable">
        <thead>
          <tr>
            <th style="width:2.5rem;text-align:center;">Active</th>
            <th style="width:2.5rem;text-align:center;">Approvals</th>
            <th>Company</th>
            <th>Slug</th>
            <th>Employees</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="companiesTbody">
          <tr><td colspan="6" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <div class="modal" id="newCompanyModal">
    <div class="modal-content">
      <h2>New company</h2>
      <div class="status" id="modalStatus"></div>

      <div class="form-group">
        <label for="companyName">Company name</label>
        <input id="companyName" type="text" placeholder="E.g. Acme Corp" />
      </div>
      <div class="form-group">
        <label for="companySlug">URL slug</label>
        <input id="companySlug" type="text" placeholder="e.g. acme-corp" />
        <small>Used in URL: /<strong id="slugPreview">slug</strong>/admin/</small>
      </div>
      <div class="form-group">
        <label for="adminEmail">Admin email</label>
        <input id="adminEmail" type="email" placeholder="admin@example.com" />
      </div>
      <div class="form-group">
        <label for="adminPassword">Admin password</label>
        <input id="adminPassword" type="password" placeholder="Secure password" />
      </div>

      <div class="modal-footer">
        <button class="btn-primary" id="createCompanyBtn">Create company</button>
        <button class="btn-secondary" id="closeModalBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content" style="max-width:520px;">
      <h2 id="settingsModalTitle">Settings</h2>

      <!-- Company language setting -->
    <div style="margin-bottom:1rem;padding-bottom:0.875rem;border-bottom:1px solid var(--border);">
      <label style="font-size:0.8rem;font-weight:600;color:#5E7682;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:0.5rem;">Default UI Language</label>
      <div style="display:flex;align-items:center;gap:0.5rem;">
        <select id="companyUiLangSelect" style="height:2rem;border-radius:6px;border:1px solid #C4CFD4;font-family:inherit;font-size:0.875rem;padding:0 0.625rem;background:#fff;flex:1;">
          <option value="en">English</option>
          <option value="fi">Suomi</option>
          <option value="sv">Svenska</option>
          <option value="et">Eesti</option>
          <option value="uk">Українська</option>
        </select>
        <button class="btn-primary" id="saveCompanyLangBtn" style="height:2rem;white-space:nowrap;">Save</button>
        <span id="companyLangStatus" style="font-size:0.8rem;color:#0E9537;display:none;">Saved!</span>
      </div>
    </div>

    <h3 style="font-size:0.8rem;font-weight:600;color:#5E7682;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.75rem;">Admin users</h3>
      <div id="adminsList" style="margin-bottom:1rem;"></div>

      <!-- Inline add/edit form -->
      <div id="adminForm" class="hidden" style="background:#F3F0F0;border:1px solid #C4CFD4;border-radius:6px;padding:0.875rem;margin-bottom:0.875rem;">
        <p id="adminFormTitle" style="font-size:0.8rem;font-weight:600;margin-bottom:0.625rem;color:#283237;"></p>
        <div class="form-group">
          <label for="adminFormName">Name</label>
          <input id="adminFormName" type="text" placeholder="First Last" />
        </div>
        <div class="form-group">
          <label for="adminFormEmail">Email</label>
          <input id="adminFormEmail" type="email" placeholder="admin@company.com" />
        </div>
        <div class="form-group">
          <label for="adminFormPassword" id="adminFormPasswordLabel">Password</label>
          <input id="adminFormPassword" type="password" placeholder="At least 6 characters" />
        </div>
        <div class="status" id="adminFormStatus"></div>
        <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
          <button class="btn-primary" id="saveAdminBtn" style="flex:1;">Save</button>
          <button class="btn-secondary" id="cancelAdminFormBtn" style="flex:1;">Cancel</button>
        </div>
      </div>

      <button class="btn-secondary" id="addAdminBtn" style="width:100%;margin-bottom:0.5rem;">+ Add admin</button>

      <div class="modal-footer">
        <button class="btn-secondary" id="closeSettingsModalBtn">Close</button>
      </div>
    </div>
  </div>

  <script>
    const companiesTbody = document.getElementById('companiesTbody');
    const statusEl = document.getElementById('status');
    const newCompanyBtn = document.getElementById('newCompanyBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const newCompanyModal = document.getElementById('newCompanyModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const createCompanyBtn = document.getElementById('createCompanyBtn');
    const companyNameInput = document.getElementById('companyName');
    const companySlugInput = document.getElementById('companySlug');
    const adminEmailInput = document.getElementById('adminEmail');
    const adminPasswordInput = document.getElementById('adminPassword');
    const slugPreview = document.getElementById('slugPreview');
    const modalStatus = document.getElementById('modalStatus');

    let currentCompanies = [];

    function showStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = `status visible ${isError ? 'error' : 'success'}`;
    }

    function showModalStatus(message, isError = false) {
      modalStatus.textContent = message;
      modalStatus.className = `status visible ${isError ? 'error' : 'success'}`;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderCompanies(companies) {
      currentCompanies = companies;
      if (companies.length === 0) {
        companiesTbody.innerHTML = '<tr><td colspan="6" class="empty">No companies. Create a new company to get started.</td></tr>';
        return;
      }
      companiesTbody.innerHTML = companies.map(c => `
        <tr>
          <td style="text-align:center;">
            <input type="checkbox" class="active-checkbox" data-id="${c.id}" data-field="active"
              ${Number(c.active) ? 'checked' : ''}
              style="width:1.1rem;height:1.1rem;accent-color:#3C1EEB;cursor:pointer;" />
          </td>
          <td style="text-align:center;">
            <input type="checkbox" class="approvals-checkbox" data-id="${c.id}" data-field="approvals_enabled"
              ${Number(c.approvals_enabled) ? 'checked' : ''}
              ${!Number(c.active) ? 'disabled' : ''}
              style="width:1.1rem;height:1.1rem;accent-color:#3C1EEB;cursor:pointer;" />
          </td>
          <td><strong>${escapeHtml(c.name)}</strong></td>
          <td><code style="font-family:'Courier New',monospace;font-size:0.8rem;background:var(--muted);border:1px solid var(--border);padding:0.1rem 0.4rem;border-radius:4px;">${escapeHtml(c.slug || '')}</code></td>
          <td>${c.employee_count || 0}</td>
          <td>
            <div style="display:flex;gap:0.375rem;">
              <button class="action-btn settings-btn" data-id="${c.id}" data-name="${escapeHtml(c.name)}">Settings</button>
              <button class="action-btn" onclick="window.location.href='/${escapeHtml(c.slug)}/admin/'">Company admin →</button>
            </div>
          </td>
        </tr>
      `).join('');

      async function toggleCompanyField(cb, id, field) {
        const value = cb.checked ? 1 : 0;
        cb.disabled = true;
        try {
          const res = await fetch('/api/companies.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, [field]: value }),
          });
          const result = await res.json();
          if (!res.ok || !result.success) {
            showStatus(result.error || 'Failed to change status.', true);
            cb.checked = !cb.checked;
          } else {
            const co = currentCompanies.find(c => c.id === id);
            if (co) co[field] = value;
            // Disable approvals checkbox if company deactivated
            if (field === 'active' && !value) {
              const approvalsCb = companiesTbody.querySelector(`.approvals-checkbox[data-id="${id}"]`);
              if (approvalsCb) approvalsCb.disabled = true;
            }
            if (field === 'active' && value) {
              const approvalsCb = companiesTbody.querySelector(`.approvals-checkbox[data-id="${id}"]`);
              if (approvalsCb) approvalsCb.disabled = false;
            }
          }
        } catch (e) {
          console.error(e);
          showStatus('Server error.', true);
          cb.checked = !cb.checked;
        } finally {
          cb.disabled = false;
        }
      }

      companiesTbody.querySelectorAll('.active-checkbox').forEach(cb => {
        cb.addEventListener('change', () => toggleCompanyField(cb, Number(cb.dataset.id), 'active'));
      });
      companiesTbody.querySelectorAll('.approvals-checkbox').forEach(cb => {
        cb.addEventListener('change', () => toggleCompanyField(cb, Number(cb.dataset.id), 'approvals_enabled'));
      });

      companiesTbody.querySelectorAll('.settings-btn').forEach(btn => {
        btn.addEventListener('click', () => openSettingsModal(Number(btn.dataset.id), btn.dataset.name));
      });
    }

    async function loadCompanies() {
      try {
        const response = await fetch('/api/companies.php');
        const result = await response.json();
        if (!response.ok || !result.success) {
          showStatus(result.error || 'Failed to load companies.', true);
          companiesTbody.innerHTML = '<tr><td colspan="6" class="empty">Error loading companies.</td></tr>';
          return;
        }
        renderCompanies(result.companies || []);
      } catch (error) {
        console.error(error);
        showStatus('Server error loading companies.', true);
      }
    }

    newCompanyBtn.addEventListener('click', () => {
      newCompanyModal.classList.add('visible');
      companyNameInput.focus();
    });

    closeModalBtn.addEventListener('click', () => {
      newCompanyModal.classList.remove('visible');
      resetForm();
    });

    companyNameInput.addEventListener('input', () => {
      const slug = companyNameInput.value.toLowerCase().trim()
        .replace(/\s+/g, '-').replace(/[^\w-]/g, '');
      if (slug) { companySlugInput.value = slug; slugPreview.textContent = slug; }
    });

    function resetForm() {
      companyNameInput.value = '';
      companySlugInput.value = '';
      adminEmailInput.value = '';
      adminPasswordInput.value = '';
      slugPreview.textContent = 'slug';
      modalStatus.className = 'status';
    }

    createCompanyBtn.addEventListener('click', async () => {
      const name = companyNameInput.value.trim();
      const slug = companySlugInput.value.trim();
      const email = adminEmailInput.value.trim();
      const password = adminPasswordInput.value;

      if (!name || !slug || !email || !password) {
        showModalStatus('Fill in all fields.', true);
        return;
      }

      createCompanyBtn.disabled = true;
      showModalStatus('Creating company...');

      try {
        const response = await fetch('/api/create_company.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, slug, email, password }),
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          showModalStatus(result.error || 'Failed to create company.', true);
          createCompanyBtn.disabled = false;
          return;
        }
        showStatus(`Company "${name}" created successfully.`);
        newCompanyModal.classList.remove('visible');
        resetForm();
        await loadCompanies();
      } catch (error) {
        console.error(error);
        showModalStatus('Server error.', true);
        createCompanyBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/logout.php');
      window.location.href = '/';
    });

    // ─── Settings modal ────────────────────────────────────────────────────────
    const settingsModal       = document.getElementById('settingsModal');
    const settingsModalTitle  = document.getElementById('settingsModalTitle');
    const adminsList          = document.getElementById('adminsList');
    const adminForm           = document.getElementById('adminForm');
    const adminFormTitle      = document.getElementById('adminFormTitle');
    const adminFormName       = document.getElementById('adminFormName');
    const adminFormEmail      = document.getElementById('adminFormEmail');
    const adminFormPassword   = document.getElementById('adminFormPassword');
    const adminFormPasswordLabel = document.getElementById('adminFormPasswordLabel');
    const adminFormStatus     = document.getElementById('adminFormStatus');
    const saveAdminBtn        = document.getElementById('saveAdminBtn');
    const cancelAdminFormBtn  = document.getElementById('cancelAdminFormBtn');
    const addAdminBtn         = document.getElementById('addAdminBtn');
    const closeSettingsModalBtn = document.getElementById('closeSettingsModalBtn');

    let settingsCompanyId = null;
    let editingAdminId    = null;

    function showAdminFormStatus(msg, isError = false) {
      adminFormStatus.textContent = msg;
      adminFormStatus.className = `status visible ${isError ? 'error' : 'success'}`;
    }

    function openAdminForm(admin = null) {
      editingAdminId = admin ? admin.id : null;
      adminFormTitle.textContent        = admin ? 'Edit admin user' : 'Add admin user';
      adminFormName.value               = admin?.name  || '';
      adminFormEmail.value              = admin?.email || '';
      adminFormPassword.value           = '';
      adminFormPasswordLabel.textContent = admin ? 'New password (leave blank to keep current)' : 'Password';
      adminFormStatus.className         = 'status';
      adminForm.classList.remove('hidden');
      addAdminBtn.classList.add('hidden');
      adminFormName.focus();
    }

    function closeAdminForm() {
      adminForm.classList.add('hidden');
      addAdminBtn.classList.remove('hidden');
      editingAdminId = null;
    }

    function renderAdminsList(admins) {
      if (!admins.length) {
        adminsList.innerHTML = '<p style="font-size:0.8rem;color:#7D95A1;margin-bottom:0.5rem;">No admin users.</p>';
        return;
      }
      adminsList.innerHTML = admins.map(a => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0.625rem;border:1px solid #C4CFD4;border-radius:6px;margin-bottom:0.375rem;background:#fff;">
          <div>
            <div style="font-size:0.875rem;font-weight:500;">${escapeHtml(a.name || a.email)}</div>
            ${a.name ? `<div style="font-size:0.75rem;color:#7D95A1;">${escapeHtml(a.email)}</div>` : ''}
            ${!Number(a.active) ? '<span style="font-size:0.7rem;color:#E01541;">Inactive</span>' : ''}
          </div>
          <div style="display:flex;gap:0.375rem;flex-shrink:0;">
            <button class="action-btn edit-admin-btn" data-id="${a.id}" style="font-size:0.75rem;">Edit</button>
            <button class="action-btn delete-admin-btn" data-id="${a.id}" style="font-size:0.75rem;color:#E01541;border-color:#F5AABB;">Delete</button>
          </div>
        </div>`).join('');

      adminsList.querySelectorAll('.edit-admin-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const admin = admins.find(a => String(a.id) === btn.dataset.id);
          if (admin) openAdminForm(admin);
        });
      });
      adminsList.querySelectorAll('.delete-admin-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this admin user?')) return;
          btn.disabled = true;
          try {
            const res    = await fetch('/api/company_admins.php', { method: 'DELETE', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id: Number(btn.dataset.id) }) });
            const result = await res.json();
            if (!res.ok || !result.success) { showStatus(result.error || 'Delete failed.', true); return; }
            await loadAdmins();
          } catch { showStatus('Server error.', true); }
          finally { btn.disabled = false; }
        });
      });
    }

    async function loadAdmins() {
      adminsList.innerHTML = '<p style="font-size:0.8rem;color:#7D95A1;">Loading...</p>';
      try {
        const res    = await fetch(`/api/company_admins.php?company_id=${settingsCompanyId}`);
        const result = await res.json();
        if (!res.ok || !result.success) { adminsList.innerHTML = '<p style="color:#E01541;font-size:0.8rem;">Error loading.</p>'; return; }
        renderAdminsList(result.admins || []);
      } catch { adminsList.innerHTML = '<p style="color:#E01541;font-size:0.8rem;">Server error.</p>'; }
    }

    const companyUiLangSelect = document.getElementById('companyUiLangSelect');
    const saveCompanyLangBtn  = document.getElementById('saveCompanyLangBtn');
    const companyLangStatus   = document.getElementById('companyLangStatus');

    function openSettingsModal(companyId, companyName) {
      settingsCompanyId = companyId;
      settingsModalTitle.textContent = `Settings – ${companyName}`;
      // Pre-select current company language
      const company = currentCompanies.find(c => c.id === companyId);
      companyUiLangSelect.value = company?.ui_language || 'en';
      companyLangStatus.style.display = 'none';
      closeAdminForm();
      settingsModal.classList.add('visible');
      loadAdmins();
    }

    saveCompanyLangBtn.addEventListener('click', async () => {
      const lang = companyUiLangSelect.value;
      saveCompanyLangBtn.disabled = true;
      try {
        const res    = await fetch('/api/companies.php', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ id: settingsCompanyId, ui_language: lang }),
        });
        const result = await res.json();
        if (!res.ok || !result.success) { showStatus(result.error || 'Save failed.', true); return; }
        const co = currentCompanies.find(c => c.id === settingsCompanyId);
        if (co) co.ui_language = lang;
        companyLangStatus.style.display = 'inline';
        setTimeout(() => { companyLangStatus.style.display = 'none'; }, 2000);
      } catch { showStatus('Server error.', true); }
      finally { saveCompanyLangBtn.disabled = false; }
    });

    closeSettingsModalBtn.addEventListener('click', () => settingsModal.classList.remove('visible'));
    addAdminBtn.addEventListener('click', () => openAdminForm());
    cancelAdminFormBtn.addEventListener('click', closeAdminForm);

    saveAdminBtn.addEventListener('click', async () => {
      const email    = adminFormEmail.value.trim();
      const name     = adminFormName.value.trim();
      const password = adminFormPassword.value;
      if (!email) { showAdminFormStatus('Email is required.', true); return; }

      saveAdminBtn.disabled = true;
      showAdminFormStatus('Saving...');
      try {
        const payload = { company_id: settingsCompanyId, email, name, password };
        if (editingAdminId) payload.id = editingAdminId;
        const res    = await fetch('/api/company_admins.php', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const result = await res.json();
        if (!res.ok || !result.success) { showAdminFormStatus(result.error || 'Save failed.', true); return; }
        closeAdminForm();
        await loadAdmins();
      } catch { showAdminFormStatus('Server error.', true); }
      finally { saveAdminBtn.disabled = false; }
    });

    loadCompanies();
  </script>
</body>
</html>
